name: Terminal demo

on:
  push:
    branches: [main]
    paths:
      - setup.sh
      - scripts/**
      - tests/**
      - config/zsh/**
      - Brewfile
      - docs/demo.tape
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-demo
  cancel-in-progress: true

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview commands
        run: |
          bash tests/smoke.sh
          ./setup.sh --help
          ./setup.sh all --dry-run
      - name: Install Zsh and Nerd Font
        run: |
          echo "HELLO_MAC_DEMO_DIR=$RUNNER_TEMP/hello-mac-demo" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y zsh
          # The hosted runner image exposes this completion directory as writable.
          sudo chmod go-w /usr/share/zsh
          curl -fL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/SourceCodePro.zip -o "$RUNNER_TEMP/source-code-pro.zip"
          mkdir -p "$HOME/.local/share/fonts/hello-mac"
          unzip -q "$RUNNER_TEMP/source-code-pro.zip" '*.ttf' -d "$HOME/.local/share/fonts/hello-mac"
          fc-cache -f
          fc-match 'SauceCodePro Nerd Font Mono'
      - name: Prepare personalized shell
        run: |
          bash scripts/prepare-demo.sh
          ZDOTDIR="$HELLO_MAC_DEMO_DIR/zsh" zsh -ic '
            [[ $ZSH_THEME == spaceship ]] &&
            (( ${plugins[(Ie)zsh-autosuggestions]} )) &&
            (( ${plugins[(Ie)zsh-syntax-highlighting]} )) &&
            (( $+functions[prompt_spaceship_setup] )) &&
            (( $+functions[_zsh_autosuggest_start] )) &&
            (( $+functions[_zsh_highlight] ))
          '
      - name: Record terminal demo
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: docs/demo.tape
          version: v0.11.0
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: terminal-demo
          path: docs/demo.gif
          if-no-files-found: error
      - name: Update README asset
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has advanced; skipping this outdated recording."
            exit 0
          fi
          git add docs/demo.gif
          if git diff --cached --quiet; then
            echo "Demo is already up to date."
            exit 0
          fi
          git config user.name "Draco"
          git config user.email "draco.coder@gmail.com"
          git commit -m "docs: refresh terminal demo"
          git push origin HEAD:main
